name: Repair pipeline unit tests

on:
  push:
    branches: ["work/etf-master-repair"]
  pull_request:
    branches: ["fix/etf-data-collector-v2", "main"]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install pandas numpy yfinance pyarrow openpyxl pykrx
      - run: python -m unittest test_repair_etf_master.py
